name: Keep Supabase awake

# Supabase's free tier pauses a project after 7 days with no API traffic.
# This just makes one harmless read every 3 days so that never happens
# during quiet development stretches. See ARCHITECTURE.md / README.md.
#
# Requires two repo secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL       — e.g. https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY  — the project's anon public key
on:
  schedule:
    - cron: "0 6 */3 * *" # every 3 days at 06:00 UTC
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/sections?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Supabase responded with HTTP $status"
          # 2xx (data) or 401/403 (reachable but RLS/auth declined it) both
          # prove the project is awake. Anything else fails the job so a
          # real outage shows up instead of going unnoticed.
          if [[ "$status" != 2* && "$status" != "401" && "$status" != "403" ]]; then
            echo "Unexpected response — project may be paused or unreachable."
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
